# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    branches:
      - scala3
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          add-job-summary: 'on-failure'
      - name: Build
        run: ./gradlew build publishToMavenLocal checkReleaseVersion
      - name: Check build file
        run: ./gradlew checkBinaryContent
      - name: capture build artifacts
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' }} # Only upload artifacts built from Ubuntu x64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SLP-fabric-${{ github.run_number }}
          path: |
            build/libs/
            build/devlibs/
      - name: Example Test Executable
        if: ${{ runner.os != 'Windows' }}
        working-directory: ./examples
        run: chmod +x ./gradlew
      - name: Example Test
        run: ./gradlew runGameTest
        working-directory: ./examples

  check-actions:
    # See https://github.com/Kotori316/common-script/blob/v2.0.3/.github/workflows/check-action.yaml
    uses: 'Kotori316/common-script/.github/workflows/check-action.yaml@f68c456ce9aa44130e67f05234bc68db848e9a54' # v2.0.5
    permissions:
      contents: read
