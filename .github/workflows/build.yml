# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    branches:
      - scala3
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          add-job-summary: 'on-failure'
      - name: Build
        run: ./gradlew build publishToMavenLocal checkReleaseVersion
      - name: Check build file
        run: ./gradlew checkBinaryContent
      - name: capture build artifacts
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' }} # Only upload artifacts built from Ubuntu x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SLP-fabric-${{ github.run_number }}
          path: |
            build/libs/
            build/devlibs/
      - name: Example Test Executable
        if: ${{ runner.os != 'Windows' }}
        working-directory: ./examples
        run: chmod +x ./gradlew
      - name: Example Test
        run: ./gradlew runGameTest
        working-directory: ./examples
