# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    branches:
      - scala3
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          add-job-summary: 'on-failure'
      - name: Build
        run: ./gradlew build publishToMavenLocal checkReleaseVersion
      - name: Check build file
        run: ./gradlew checkBinaryContent
      - name: capture build artifacts
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' }} # Only upload artifacts built from Ubuntu x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SLP-fabric-${{ github.run_number }}
          path: |
            build/libs/
            build/devlibs/
      - name: Example Test Executable
        if: ${{ runner.os != 'Windows' }}
        working-directory: ./examples
        run: chmod +x ./gradlew
      - name: Example Test
        run: ./gradlew runGameTest
        working-directory: ./examples

  check-actions:
    # See https://github.com/Kotori316/common-script/blob/v2.0.3/.github/workflows/check-action.yaml
    uses: 'Kotori316/common-script/.github/workflows/check-action.yaml@cc63e8610e21a91ed102150d078b10d216e02b76' # v2.0.3
    permissions:
      contents: read
