# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    branches:
      - scala3
  pull_request: {}

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS & minimum supported by Minecraft
        ]
        # and run on both Linux and Windows
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: 'on-failure'
      - name: Build
        run: ./gradlew build publishToMavenLocal checkReleaseVersion
      - name: capture build artifacts
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.java == '21' && github.event_name == 'push' }} # Only upload artifacts built from Java21 and Ubuntu x64
        uses: actions/upload-artifact@v6
        with:
          name: SLP-fabric-${{ github.run_number }}
          path: |
            build/libs/
            build/devlibs/
      - name: Example Test Executable
        if: ${{ runner.os != 'Windows' }}
        working-directory: ./examples
        run: chmod +x ./gradlew
      - name: Example Test
        if: matrix.os != 'ubuntu-24.04-arm'
        run: ./gradlew runGameTest
        working-directory: ./examples
