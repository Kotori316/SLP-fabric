name: Release

on: [ workflow_dispatch ] # Manual trigger

jobs:
  release:
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
    # See https://github.com/Kotori316/common-script/blob/v2/.github/workflows/release-prod-gradle.yaml
    uses: 'Kotori316/common-script/.github/workflows/release-prod-gradle.yaml@f68c456ce9aa44130e67f05234bc68db848e9a54' # v2.0.5
    with:
      release_command: 'checkReleaseVersion build publishMods publish registerVersion --stacktrace --no-daemon'
      enable_signature_check: false
      java_version: '25'
      use_gradle_cache: true
    secrets: inherit
