[versions]
minecraft_main = "26.1.2"
minecraft_v260102 = "26.1.2"
fabric_loader = "0.19.2"
fabric_v260102 = "0.148.2+26.1.2"
slp_fabric = "4.+"
scala = "3.8.3"
cats = "2.13.0-kotori"

plugin_fabric_loom = "1.16.2"
plugin_publish_all = "1.+"
plugin_cf = "4.0"
plugin_idea_ext = "1.4.1"
plugin_shadow = "9.4.1"

[libraries]
minecraft_main = { group = "com.mojang", name = "minecraft", version.ref = "minecraft_main" }
minecraft_v260102 = { group = "com.mojang", name = "minecraft", version.ref = "minecraft_v260102" }
fabric_loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric_loader" }
fabric_api_v260102 = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric_v260102" }
slp_fabric = { group = "com.kotori316", name = "scalable-cats-force-fabric", version.ref = "slp_fabric" }
scala = { group = "org.scala-lang", name = "scala-library", version.ref = "scala" }
cats_core = { group = "org.typelevel", name = "cats-core_3", version.ref = "cats" }
cats_kernel = { group = "org.typelevel", name = "cats-kernel_3", version.ref = "cats" }
cats_free = { group = "org.typelevel", name = "cats-free_3", version.ref = "cats" }

[bundles]
scala = ["scala"]
cats = ["cats_core", "cats_kernel", "cats_free"]

[plugins]
loom = { id = "net.fabricmc.fabric-loom", version.ref = "plugin_fabric_loom" }
publish-all = { id = "me.modmuss50.mod-publish-plugin", version.ref = "plugin_publish_all" }
cf = { id = "com.kotori316.plugin.cf", version.ref = "plugin_cf" }
idea-ext = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "plugin_idea_ext" }
shadow = { id = "com.gradleup.shadow", version.ref = "plugin_shadow" }
